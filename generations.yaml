generations:
  - name: "Sixth Generation with xDrive (F10/F11)"
    start_year: 2010
    end_year: 2017
    description: "The F10/F11 generation 5 Series was the first to widely offer BMW's xDrive all-wheel drive system across multiple variants globally. Sales of all-wheel drive xDrive models began in June 2010. The xDrive system provided intelligent torque distribution between front and rear axles, enhancing traction in adverse conditions while maintaining the 5 Series' dynamic handling characteristics. Available on both sedan (F10) and wagon (F11) body styles, the xDrive system was offered with a range of engines from four-cylinder diesels to powerful V8s, including the M550d xDrive. This generation featured an eight-speed automatic transmission, efficient turbocharged engines, and advanced driver assistance systems."

  - name: "Seventh Generation with xDrive (G30/G31)"
    start_year: 2017
    end_year: 2020
    description: "The G30/G31 5 Series introduced refined xDrive all-wheel drive with faster response times and more sophisticated electronic control. Sales began in February 2017 following an announcement in October 2016. xDrive was available on most engine variants, including the plug-in hybrid 530e iPerformance and the performance-oriented M550i, which featured M Performance-tuned suspension and a powerful V8 engine. The G30 generation also introduced the M5 with M xDrive (F90 M5), the first M5 to employ an all-wheel drive powertrain, featuring a switchable system that could operate in rear-wheel drive mode for track driving. This generation combined exceptional comfort, advanced technology, and engaging dynamics regardless of weather conditions."

  - name: "Seventh Generation with xDrive (G30/G31) Facelift"
    start_year: 2020
    end_year: 2023
    description: "The G30/G31 5 Series underwent a comprehensive facelift and Life Cycle Impulse (LCI) reveal in May 2020. The facelift introduced redesigned front and rear bumpers with new headlights and taillights featuring simplified L-shaped daytime running lights. The kidney grille design was sharpened, and adaptive LED headlights became standard (previously optional) with options for matrix LED or laser headlamps. The engine range was revamped with twin-turbocharging for all diesel engines and optimized direct injection for petrol engines. Hybrid models received a 48-volt system adding 8 kW of power. The xDrive system continued to be refined, maintaining its position across most engine variants and providing enhanced all-weather capability through the final year of G30 production."

  - name: "Eighth Generation with xDrive (G60)"
    start_year: 2023
    end_year: null
    description: "The latest G60 5 Series continues to offer xDrive all-wheel drive across much of the range, with further refinements to improve efficiency and dynamic response. Production commenced in summer 2023 with first deliveries beginning around October 2023 following the May 2023 reveal. xDrive is available on the 540i (standard), which features a 375-hp turbocharged inline-six engine, and the range-topping M60 xDrive model. The system is available with mild-hybrid and plug-in hybrid (550e) powertrains, providing all-weather capability without significantly compromising fuel efficiency. The xDrive system is fully integrated with the vehicle's adaptive suspension systems and driving dynamics control, allowing drivers to tailor the car's character. This generation features BMW's most advanced driver assistance systems and digital technology, maintaining the 5 Series' position as a technological flagship while providing the security and handling benefits of all-wheel drive in a luxurious executive package."
